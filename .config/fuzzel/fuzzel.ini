[main]
dpi-aware = no
fields = name,generic,comment,categories,filename,keywords
font = Font Awesome:weight=bold:size=11
horizontal-pad = 20
icon-theme = Colloid-Green-Dracula-Dark
layer = overlay
line-height = 23
prompt = "❯  " 
terminal = ghostty -e
width = 60

[border]
radius = 10
width = 2

[colors]
background = 1f1d2eff
border = 9ccfd8ff
match = f6c177ff
selection = 403d52ff
selection-match = 9ccfd8ff
selection-text = e0def4ff
text = e0def4ff

[dmenu]
exit-immediately-if-empty = yes
